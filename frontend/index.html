<!DOCTYPE html>
<html>
    <head>
        <title>
            Create User
        </title>
        <!-- Fixed: properly close link tag so head parses correctly -->
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <!-- Keep id lowercase; JS now uses the same id -->
        <div id="formsection">
            <form id="userform">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>
                <label for="email">Email:</label>
                <!-- Fixed: use name attribute instead of invalid email attribute -->
                <input type="email" id="email" name="email" required>
                <br><br>
                <button type="submit">Submit</button>
            </form>
        </div>

        <div id="SuccessSection" class="hidden success-box">
            <h3>User Created</h3>
            <h1>Note your user id and email for login</h1>
            <div id="responseContainer" class="response-box"></div>
        </div>

        <!-- Fixed: load JS file so submit handler runs -->
        <script src="index.js"></script>
    </body>
</html>
